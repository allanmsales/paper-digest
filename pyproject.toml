[project]
name = "paper-digest"
version = "0.1.0"
description = "Application that helps a human to understand a cientific paper"
readme = "README.md"
authors = [
    { email = "allan.sales@factored.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.157",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
paper-digest = "paper_digest:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
