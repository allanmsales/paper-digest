services:
  api:
    platform: linux/amd64

    build:
      context: .
      dockerfile: Dockerfile

    container_name: paper-digest-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    command:
      [
        "uv",
        "run",
        "uvicorn",
        "--app-dir",
        "src",
        "paper_digest.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]
  web:
    image: node:22-alpine

    container_name: paper-digest-web

    working_dir: /app

    ports:
      - "5173:5173"

    environment:
      - API_URL=http://api:8000

    volumes:
      - ./web:/app
      # Keep the container's Linux node_modules separate from the host's.
      - /app/node_modules

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    depends_on:
      - api
