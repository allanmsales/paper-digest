services:
  api:
    platform: linux/amd64

    build:
      context: .
      dockerfile: Dockerfile

    container_name: paper-digest-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    command:
      [
        "uv",
        "run",
        "uvicorn",
        "--app-dir",
        "src",
        "paper_digest.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]